repos:
  - repo: https://github.com/pre-commit/mirrors-autopep8
    rev: v2.0.4
    hooks:
      - id: autopep8
        args: ['--max-line-length=79']

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.2  # Остання стабільна версія
    hooks:
      - id: flake8
        args: ['--max-line-length=79']

  - repo: https://github.com/psf/black  # Правильний репозиторій для black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
