# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# This job will install pre-commit and run pre-commit hooks.
jobs:
  pre-commit:
    docker:
      - image: cimg/python:3.8  # Docker image with Python 3.8, which is suitable for pre-commit hooks.

    steps:
      - checkout  # Step to check out the code from the repository.

      # Step to install pre-commit
      - run:
          name: Install pre-commit
          command: |
            python -m pip install --upgrade pip
            pip install pre-commit
            pre-commit install  # Install pre-commit hooks

      # Step to run pre-commit hooks on all files
      - run:
          name: Run pre-commit hooks
          command: pre-commit run --all-files  # Run pre-commit on all files in the repo.

# Orchestrate jobs using workflows
workflows:
  version: 2
  pre-commit-workflow:  # Workflow name
    jobs:
      - pre-commit  # The job to run in the workflow.
